# StreetUnveiler Training Configuration File
# This file contains essential settings for training the StreetUnveiler model

# Feature Extraction and Depth Estimation Configuration
feature_cfg:
  # Enable/disable feature-based losses
  enabled: true  # Set to false to disable feature extraction and depth-based losses
  
  device: "cuda"
  mono_prior:
    feature_extractor: "dinov2_reg_small_fine"  # Feature extractor for uncertainty prediction
    depth: "metric3d_vit_large"  # Depth estimation model
  data:
    output: null  # Will be set dynamically to dataset.model_path
  scene: "default_scene"  # Will be overridden if dataset has scene_name
  cam:
    fx: 1000.0  # Default focal length, should be adjusted based on dataset

# Uncertainty Configuration
uncertainty:
  # Enable/disable uncertainty estimation
  enabled: true  # Set to false to disable uncertainty loss computation
  
  # Learning rate and optimization parameters
  lr: 0.0004  # Learning rate for uncertainty MLP
  weight_decay: 0.00001  # Weight decay for uncertainty MLP optimizer
  
  # MLP architecture parameters
  input_features: 384  # Number of input features from feature extractor
  hidden_dim: 64  # Hidden layer dimension
  net_depth: 2  # Number of hidden layers
  
  # Loss computation parameters
  ssim_median_filter_size: 5
  ssim_window_size: 7
  uncer_depth_mult: 0.2
  dino_feature_mult: 0.5  # Weight for DINO feature cosine similarity loss
  opacity_th_for_uncer_loss: 0.9
  fallback_loss_weight: 0.01  # Fallback simple uncertainty loss weight
  beta_epsilon: 1.0e-8  # Small epsilon to avoid division by zero in uncertainty computation
  train_frac_fix: 0.3
  
  # DINO feature regularization parameters
  reg_stride: 2
  reg_mult: 0.5
  
  # RGB boundary threshold for valid pixel mask
  rgb_boundary_threshold: 0.01

# Loss Weights and Parameters
loss_weights:
  # Semantic loss weights for cross entropy (6 classes)
  semantic_ce_weights: [1.0, 1.0, 1.0, 1.0, 0.2, 1.0]
  
  # Feature and depth loss weights
  feature_loss_weight: 0.1  # Weight for depth-based feature loss
  
  # Render loss lambda parameters (from paper)
  render_lambda5: 0.5  # Color loss weight in render loss
  render_lambda6: 0.5  # Depth loss weight in render loss
  render_lambda7: 0.5  # Isotropic regularization weight in render loss
  
  # Uncertainty loss lambda parameters
  uncertainty_lambda1: 1.0  # Weight for depth uncertainty term
  uncertainty_lambda2: 0.01  # Weight for variance regularization
  uncertainty_lambda3: 0.01  # Weight for uncertainty regularization
  
  # Semantic-aware uncertainty regularization
  lambda_sem_cons: 0  # Intra-class consistency weight for uncertainty map

# Training Progress and Logging
progress:
  # Progress bar configuration
  bar_style: "smooth"
  spinner_style: "dots_waves"
  
  # Progress titles
  depth_precompute_title: "Pre-computing GT depths"
  training_title: "🚀 Training Progress"
  uncertainty_generation_title: "🎨 Generating Uncertainty & Depth Maps"
  
  # Progress update intervals
  update_interval: 10  # Update progress bar every 10 iterations
  
  # EMA coefficients for loss logging
  ema_current_weight: 0.4
  ema_history_weight: 0.6
  
  # Progress messages
  loss_format: "🔥 Loss: {:.7f} | Iter: {}/{}"
  processing_frame_format: "📸 Processing frame {}"
  training_complete_format: "✅ Training Complete! Final Loss: {:.7f}"

# Output Directories
output:
  uncertainty_maps_dir: "uncertainty_maps"
  depth_maps_dir: "depth_maps"
  rendered_depth_subdir: "rendered_depth"
  gt_depth_subdir: "gt_depth"
  checkpoint_dir: "checkpoint"
  
  # File formats and naming
  uncertainty_filename_format: "{}_uncertainty.png"
  rendered_depth_filename_format: "{}_rendered_depth.png"
  gt_depth_filename_format: "{}_gt_depth.png"
  frame_name_format: "{:05d}"
  
  # Colormap for visualizations
  depth_colormap: "jet"
  uncertainty_colormap: "jet"

# Densification and Pruning
densification:
  size_threshold: 20  # Size threshold when iteration > opacity_reset_interval
  prune_opacity_threshold: 0.5  # Opacity threshold for pruning
  densification_multiplier: 1.15  # Multiplier for densification interval calculation

# Semantic Configuration
semantic:
  sky_class_name: "sky"
  vegetation_class_name: "vegetation"
  dont_prune_classes: ["sky", "vegetation"]  # Classes that may be transparent

# Validation and Testing
validation:
  pick_frame_range:
    start: 2
    end: 500
    step: 70
  max_images_to_log: 8  # Maximum number of images to log to tensorboard
  
  # Normal map visualization scaling
  normal_visualization_offset: 0.5
  normal_visualization_scale: 0.5

# File Extensions and Formats
file_formats:
  checkpoint_extension: ".pt"
  depth_extension: ".npy"
  image_extension: ".png"
  stats_filename: "computation_statistics.txt"
  config_args_filename: "cfg_args"

# Training Loop Configuration
training_loop:
  sh_degree_update_interval: 1000  # Update SH degree every N iterations
  
# Background Colors
background:
  white_bg: [1, 1, 1]
  black_bg: [0, 0, 0]

# Tensor Operations
tensor_ops:
  interpolation_mode: "bilinear"
  align_corners: false
  clamp_min: 1.0e-6  # Minimum value for log clamping in uncertainty regularization

# Tensorboard Logging
tensorboard:
  log_prefix_train: "train_loss_patches"
  log_suffix_loss: "_loss"
  total_loss_name: "total_loss"
  iter_time_name: "iter_time"
  opacity_histogram_name: "scene/opacity_histogram"
  total_points_name: "total_points" 