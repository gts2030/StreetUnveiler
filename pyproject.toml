[project]
name = "streetunveiler"
version = "1.0.0"
description = "3D StreetUnveiler with Semantic-aware 2DGS"
authors = [
    {name = "Jingwei Xu", email = "xujingwei@shanghaitech.edu.cn"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    # Core ML libraries
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    # Computer Vision & Image Processing
    "opencv-python",
    "plyfile",
    "open3d",
    "trimesh",
    "albumentations>=1.0.0",
    "kornia>=0.6.0",
    # ML/DL utilities
    "scikit-learn",
    "scikit-image",
    "numpy>=1.22.4",
    "matplotlib>=3.5.3",
    "einops",
    "timm>=0.4.12",
    # Transformers and Diffusion models
    "transformers==4.39.3",
    "diffusers==0.27.2",
    "huggingface_hub==0.20.2",
    "open_clip_torch==2.16.0",
    # Training and logging
    "tensorboardX",
    "tensorboard",
    "pytorch_lightning>=1.5.0",
    "tqdm",
    # Evaluation metrics
    "pytorch-fid",
    "lpips",
    # Configuration and utilities
    "omegaconf",
    "easydict",
    "yacs==0.1.8",
    "pyquaternion",
    "mediapy",
    "webdataset",
    "Cython",
    # Dataset specific
    "nuscenes-devkit",
    "pykitti",
    
    # Local submodules (installed separately with --no-build-isolation)
    # Note: These are installed manually due to build dependencies on PyTorch
    # "superpose3d @ file://submodules/superpose3d",
    # "sh-encoder @ file://submodules/sh_encoder", 
    # "simple-knn @ file://submodules/simple-knn",
    # "diff-surfel-rasterization @ file://submodules/diff-surfel-rasterization",
    # "tinycudann @ file://submodules/tiny-cuda-nn/bindings/torch",
    # "pandaset @ file://submodules/pandaset-devkit/python",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arguments", "gaussian_renderer", "scene", "utils"]

[tool.uv]
dev-dependencies = []

# Local sources for submodules
[tool.uv.sources]
# Note: These are commented out because they require manual installation
# due to build-time dependencies on PyTorch
# superpose3d = { path = "submodules/superpose3d", editable = true }
# sh-encoder = { path = "submodules/sh_encoder", editable = true }  
# simple-knn = { path = "submodules/simple-knn", editable = true }
# diff-surfel-rasterization = { path = "submodules/diff-surfel-rasterization", editable = true }
# tinycudann = { path = "submodules/tiny-cuda-nn/bindings/torch", editable = true }
# pandaset = { path = "submodules/pandaset-devkit/python", editable = true }

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88
